name: Terraform CI

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.hcl"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.hcl"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize without remote backend
        run: terraform -chdir=envirnment/dev init -backend=false
      - name: Validate root module and child modules
        run: terraform -chdir=envirnment/dev validate
